<!<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kauã Johari</title>
  <style>
    :root {
      --primary-green: #2ecc71;
      --dark-green: #1b4d3e;
      --light-green: #e8f8f5;
      --accent-green: #27ae60;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--light-green);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 40px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      border-top: 8px solid var(--accent-green);
    }

    .avatar {
      width: 100px;
      height: 100px;
      background-color: var(--primary-green);
      color: white;
      font-size: 36px;
      font-weight: bold;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 4px 10px rgba(46, 204, 113, 0.4);
    }

    h1 {
      color: var(--dark-green);
      margin-bottom: 10px;
      font-size: 26px;
    }

    p {
      color: #666;
      margin-bottom: 25px;
      font-size: 16px;
    }

    .like-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .like-btn {
      background-color: var(--primary-green);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
    }

    .like-btn:hover {
      background-color: var(--accent-green);
      transform: translateY(-2px);
    }

    .like-btn:active {
      transform: translateY(0);
    }

    .like-count {
      font-size: 16px;
      color: var(--dark-green);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">KJ</div>
    <h1>Kauã Johari</h1>
    <p>Bem-vindo ao meu espaço personalizado!</p>

    <div class="like-section">
      <button class="like-btn" id="likeBtn">
        💚 Curtir
      </button>
      <span class="like-count" id="likeCounter">0 curtidas</span>
    </div>
  </div>

  <script>
    let count = 0;
    const likeBtn = document.getElementById('likeBtn');
    const likeCounter = document.getElementById('likeCounter');

    likeBtn.addEventListener('click', () => {
      count++;
      likeCounter.textContent = `${count} ${count === 1 ? 'curtida' : 'curtidas'}`;
    });
  </script>

</body>
</html>
